- name: Install dnsmasq package
  ansible.builtin.apt:
    name: "{{ dnsmasq_package_name }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [install]

- name: Ensure the drop-in configuration directory exists
  ansible.builtin.file:
    path: /etc/dnsmasq.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [install]
