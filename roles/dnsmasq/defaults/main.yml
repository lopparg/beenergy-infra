---
# ============================================================
# dnsmasq role — default variables
# ============================================================
# Variable precedence (weakest to strongest):
#   defaults/ < group_vars/ < host_vars/ < --extra-vars
#
# To override for your own environment:
#   cp local.example.yml local.yml && nano local.yml
#   ansible-playbook playbooks/site.yml -e @local.yml -K
# ============================================================

# ---- Package ----
dnsmasq_package_name: dnsmasq
dnsmasq_service_name: dnsmasq

# ---- Upstream DNS ----
# Public resolvers by default: deterministic, so anyone cloning this
# repository gets the same result. On an isolated network, set your
# own gateway instead (this VM's NAT gateway is 192.168.72.2).
dnsmasq_upstream_servers:
  - 1.1.1.1
  - 8.8.8.8

# ---- Listening ----
dnsmasq_listen_addresses:
  - 127.0.0.1
dnsmasq_bind_interfaces: true

# ---- Local domain ----
# .local is deliberately NOT used: it is reserved for mDNS (RFC 6762).
dnsmasq_local_domain: beenergy.internal
dnsmasq_expand_hosts: true

# ---- Static records (used by the verification step) ----
dnsmasq_static_hosts:
  - name: "dns.{{ dnsmasq_local_domain }}"
    ip: 127.0.0.1

# ---- Cache ----
dnsmasq_cache_size: 1000
dnsmasq_neg_ttl: 60

# ---- Privacy and hygiene ----
dnsmasq_domain_needed: true
dnsmasq_bogus_priv: true
dnsmasq_stop_dns_rebind: true
dnsmasq_no_resolv: true

# ---- DHCP ----
# Requirement: "we do not need dhcp server".
# dnsmasq only starts its DHCP service when a dhcp-range is defined.
# None is defined, so no DHCP service will run. This flag documents intent.
dnsmasq_enable_dhcp: false

# ---- Logging ----
dnsmasq_log_queries: false
dnsmasq_log_facility: /var/log/dnsmasq.log

# ---- Port 53 conflict management ----
dnsmasq_manage_systemd_resolved: true
dnsmasq_manage_resolv_conf: true

# ---- Verification ----
dnsmasq_verify_enabled: true
dnsmasq_verify_domains:
  - github.com
  - "dns.{{ dnsmasq_local_domain }}"
