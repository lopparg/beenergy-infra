---
- name: Deploy dnsmasq as a caching DNS forwarder
  hosts: dns_servers
  gather_facts: true

  pre_tasks:
    # Ubuntu 25.10+ ships sudo-rs (Rust) as the default sudo.
    # It rejects the way Ansible feeds the become password over stdin,
    # failing with "interactive authentication is required".
    # The original sodu remains available as /usr/bin/sudo.ws.
    - name: Check for the original sudo binary (sudo-rs workaround)
      ansible.builtin.stat:
        path: /usr/bin/sudo.ws
      register: sudo_ws_binary
      tags: [always]

    - name: Use the original sudo when sudo-rs is the default
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      when: sudo_ws_binary.stat.exists
      tags: [always]

  roles:
    - role: dnsmasq
      tags: [dnsmasq]
